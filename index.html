<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14324f">
  <meta name="description" content="Práctica de capitán de yate: teoría, meteorología e inglés, con la respuesta y el porqué.">
  <title>Práctica de capitán de yate</title>
  <style>
    :root {
      --bg: #f3f0e8;
      --surface: #fffcf7;
      --ink: #1c1915;
      --muted: #5e584e;
      --line: #e3dccf;
      --accent: #14324f;
      --accent-ink: #f7f4ee;
      --ok: #0e6b45;
      --ok-bg: #e5f5ec;
      --bad: #8d3b2f;
      --bad-bg: #fdecea;
      --warn-bg: #fbf3df;
      --shadow: 0 1px 0 rgba(28, 25, 21, 0.04);
      --dock: 7.6rem;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14181d;
        --surface: #1d242c;
        --ink: #f3efe6;
        --muted: #b7b0a4;
        --line: #31404c;
        --accent: #d7e4f0;
        --accent-ink: #14324f;
        --ok: #8fd9b0;
        --ok-bg: #163528;
        --bad: #f0b2a8;
        --bad-bg: #3a221e;
        --warn-bg: #3a321c;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font: 17px/1.45 "Segoe UI", system-ui, sans-serif;
      overflow-x: hidden;
    }
    button, input { font: inherit; }
    .wrap {
      width: min(40rem, 100%);
      margin: 0 auto;
      padding:
        calc(0.75rem + env(safe-area-inset-top))
        max(1rem, env(safe-area-inset-right))
        calc(var(--dock) + 1.25rem + env(safe-area-inset-bottom))
        max(1rem, env(safe-area-inset-left));
    }
    header h1 {
      margin: 0;
      font-size: 1.35rem;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }
    .lede, .stem, .kicker, .opt, .result p {
      overflow-wrap: anywhere;
    }
    .lede {
      margin: 0.4rem 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.4rem;
      margin: 0.9rem 0 0.75rem;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 0.7rem;
      padding: 0.45rem 0.35rem 0.5rem;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .stat b {
      display: block;
      font-size: 1.15rem;
      line-height: 1.1;
    }
    .stat span {
      display: block;
      margin-top: 0.15rem;
      color: var(--muted);
      font-size: 0.68rem;
      letter-spacing: 0.01em;
    }
    .stat.ok b { color: var(--ok); }
    .stat.bad b { color: var(--bad); }
    .mods {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      padding-bottom: 0.2rem;
      scrollbar-width: none;
    }
    .mods::-webkit-scrollbar { display: none; }
    .chip, .dock button, .opt {
      touch-action: manipulation;
    }
    .chip {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 999px;
      min-height: 2.5rem;
      padding: 0 0.9rem;
    }
    .chip[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }
    .card {
      margin-top: 0.9rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 1rem;
      padding: 1rem 1rem 1.1rem;
      box-shadow: var(--shadow);
    }
    .kicker {
      margin: 0;
      color: var(--muted);
      font-size: 0.78rem;
    }
    .stem {
      margin: 0.45rem 0 0.9rem;
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.35;
    }
    .options { display: flex; flex-direction: column; gap: 0.5rem; }
    .opt {
      display: flex;
      gap: 0.7rem;
      align-items: flex-start;
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 0.8rem;
      min-height: 3rem;
      padding: 0.7rem 0.75rem;
    }
    .opt .letter {
      flex: 0 0 auto;
      width: 1.7rem;
      height: 1.7rem;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: var(--bg);
      font-weight: 700;
      font-size: 0.85rem;
    }
    .opt:focus-visible, .chip:focus-visible, .dock button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .opt.correct {
      border-color: var(--ok);
      background: var(--ok-bg);
    }
    .opt.wrong {
      border-color: var(--bad);
      background: var(--bad-bg);
    }
    .opt:disabled { cursor: default; }
    .result {
      margin-top: 0.9rem;
      border-radius: 0.8rem;
      padding: 0.75rem 0.8rem;
    }
    .result.good { background: var(--ok-bg); }
    .result.bad { background: var(--warn-bg); }
    .result h2 {
      margin: 0 0 0.35rem;
      font-size: 1rem;
    }
    .result p { margin: 0; }
    .progress {
      margin: 0.75rem 0 0;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      background: var(--bg);
      border-top: 1px solid var(--line);
      padding:
        0.55rem
        max(1rem, env(safe-area-inset-right))
        calc(0.55rem + env(safe-area-inset-bottom))
        max(1rem, env(safe-area-inset-left));
    }
    .dock-inner {
      width: min(40rem, 100%);
      margin: 0 auto;
      display: flex;
      gap: 0.45rem;
    }
    .dock button {
      flex: 1 1 0;
      min-height: 2.75rem;
      border-radius: 0.75rem;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
    }
    .dock button.primary {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
      flex: 1.3 1 0;
    }
    .dock button:disabled {
      opacity: 0.45;
    }
    .tools {
      width: min(40rem, 100%);
      margin: 0.35rem auto 0;
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .tools button {
      border: 0;
      background: transparent;
      color: var(--muted);
      min-height: 2rem;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 0.15rem;
    }
    @media (max-width: 640px) {
      :root { --dock: 0px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stat span { font-size: 0.75rem; }
      .dock {
        position: static;
        z-index: auto;
        background: transparent;
        border-top: 0;
        padding: 0 0 0.85rem;
      }
      .tools { margin-top: 0.2rem; }
    }
    @media (min-width: 720px) {
      header h1 { font-size: 1.7rem; }
      .stem { font-size: 1.15rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Práctica de capitán de yate</h1>
      <p class="lede">Marca una opción y verás la respuesta de la plantilla y el porqué, según los apuntes. En cálculo entran los husos y, con el dato del almanaque ya escrito, el paso del Sol, el horario en el lugar y la corrección total.</p>
      <div class="stats" aria-live="polite">
        <div class="stat ok"><b id="n-ok">0</b><span>Aciertos</span></div>
        <div class="stat bad"><b id="n-bad">0</b><span>Fallos</span></div>
        <div class="stat"><b id="n-left">0</b><span>Pendientes</span></div>
        <div class="stat"><b id="n-all">0</b><span>En el mazo</span></div>
      </div>
      <div class="mods" id="mods" role="group" aria-label="Módulo"></div>
    </header>
    <article class="card" id="card">
      <div class="dock">
        <div class="dock-inner">
          <button type="button" id="prev">Anterior</button>
          <button type="button" class="primary" id="next" disabled>Siguiente</button>
        </div>
        <div class="tools">
          <button type="button" id="shuffle">Barajar</button>
          <button type="button" id="reset">Borrar marcas</button>
        </div>
      </div>
      <p class="kicker" id="kicker"></p>
      <p class="stem" id="stem"></p>
      <div class="options" id="options"></div>
      <div class="result" id="result" hidden></div>
      <p class="progress" id="progress"></p>
    </article>
  </div>
  <script src="banco.js"></script>
  <script>
    const MODULES = [
      ["Todas", "Todas"],
      ["Teoría de navegación", "Teoría"],
      ["Cálculo de navegación", "Cálculo"],
      ["Meteorología", "Meteorología"],
      ["Inglés", "Inglés"]
    ];
    const STORE = "cy-practica-v1";
    const bank = Array.isArray(window.BANK) ? window.BANK : [];

    const state = load();
    const mods = document.getElementById("mods");
    const optionsEl = document.getElementById("options");
    const resultEl = document.getElementById("result");

    MODULES.forEach(([id, label]) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "chip";
      button.textContent = label;
      button.dataset.module = id;
      button.setAttribute("aria-pressed", String(state.module === id));
      button.addEventListener("click", () => {
        state.module = id;
        state.index = 0;
        save();
        render();
      });
      mods.appendChild(button);
    });

    document.getElementById("prev").addEventListener("click", () => move(-1));
    document.getElementById("next").addEventListener("click", () => move(1));
    document.getElementById("shuffle").addEventListener("click", () => {
      state.seed = (state.seed + 1) >>> 0;
      state.index = 0;
      save();
      render();
    });
    document.getElementById("reset").addEventListener("click", () => {
      if (!window.confirm("Se borran los aciertos y los fallos de este navegador.")) return;
      state.picks = {};
      state.index = 0;
      save();
      render();
    });

    render();

    function load() {
      try {
        const raw = JSON.parse(localStorage.getItem(STORE) || "");
        if (raw && typeof raw === "object") {
          return {
            module: MODULES.some(([id]) => id === raw.module) ? raw.module : "Todas",
            seed: Number.isInteger(raw.seed) ? raw.seed : 7,
            index: Number.isInteger(raw.index) ? raw.index : 0,
            picks: raw.picks && typeof raw.picks === "object" ? raw.picks : {}
          };
        }
      } catch (error) {
        /* empieza de cero */
      }
      return { module: "Todas", seed: 7, index: 0, picks: {} };
    }

    function save() {
      localStorage.setItem(STORE, JSON.stringify(state));
    }

    function shuffle(ids, seed) {
      const copy = ids.slice();
      let value = seed >>> 0;
      for (let i = copy.length - 1; i > 0; i -= 1) {
        value = (Math.imul(value, 1664525) + 1013904223) >>> 0;
        const j = value % (i + 1);
        const swap = copy[i];
        copy[i] = copy[j];
        copy[j] = swap;
      }
      return copy;
    }

    function deck() {
      const pool = bank.filter((item) => state.module === "Todas" || item.module === state.module);
      const byId = new Map(pool.map((item) => [item.id, item]));
      return shuffle(pool.map((item) => item.id), state.seed)
        .map((id) => byId.get(id))
        .filter(Boolean);
    }

    function move(step) {
      const items = deck();
      if (!items.length) return;
      state.index = (state.index + step + items.length) % items.length;
      save();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function render() {
      const items = deck();
      if (!items.length) return;
      if (state.index < 0 || state.index >= items.length) state.index = 0;
      const item = items[state.index];
      const pick = state.picks[item.id] || "";
      const revealed = Boolean(pick);

      let ok = 0;
      let bad = 0;
      items.forEach((question) => {
        const chosen = state.picks[question.id];
        if (!chosen) return;
        if (chosen === question.letter) ok += 1;
        else bad += 1;
      });
      document.getElementById("n-ok").textContent = String(ok);
      document.getElementById("n-bad").textContent = String(bad);
      document.getElementById("n-left").textContent = String(items.length - ok - bad);
      document.getElementById("n-all").textContent = String(items.length);

      mods.querySelectorAll(".chip").forEach((chip) => {
        chip.setAttribute("aria-pressed", String(chip.dataset.module === state.module));
      });

      document.getElementById("kicker").textContent =
        item.module + " · " + item.topic + " · " + item.conv + " · " + item.n;
      document.getElementById("stem").textContent = item.stem;
      document.getElementById("progress").textContent =
        (state.index + 1) + " de " + items.length + " en este mazo" +
        (revealed ? "" : ". Marca una opción para seguir.");

      optionsEl.replaceChildren();
      ["A", "B", "C", "D"].forEach((letter) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "opt";
        button.disabled = revealed;
        if (revealed && letter === item.letter) button.classList.add("correct");
        if (revealed && letter === pick && letter !== item.letter) button.classList.add("wrong");
        const badge = document.createElement("span");
        badge.className = "letter";
        badge.textContent = letter;
        const text = document.createElement("span");
        text.textContent = item[letter.toLowerCase()];
        button.append(badge, text);
        button.addEventListener("click", () => choose(item, letter));
        optionsEl.appendChild(button);
      });

      const next = document.getElementById("next");
      next.disabled = !revealed;
      if (!revealed) {
        resultEl.hidden = true;
        resultEl.replaceChildren();
        return;
      }
      resultEl.hidden = false;
      resultEl.className = "result " + (pick === item.letter ? "good" : "bad");
      const title = document.createElement("h2");
      title.textContent = pick === item.letter
        ? "Correcta. La plantilla marca la " + item.letter + "."
        : "Has marcado la " + pick + ". La plantilla da la " + item.letter + ".";
      const why = document.createElement("p");
      why.textContent = item.why;
      resultEl.replaceChildren(title, why);
    }

    function choose(item, letter) {
      if (state.picks[item.id]) return;
      state.picks[item.id] = letter;
      save();
      render();
      resultEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  </script>
</body>
</html>
